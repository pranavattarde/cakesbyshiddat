server {
    listen 80;
    listen [::]:80;
    server_name cakesbyshiddat.com www.cakesbyshiddat.com admin.cakesbyshiddat.com api.cakesbyshiddat.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'SSL bootstrap in progress\n';
        add_header Content-Type text/plain;
    }
}
